on:
  push:
    branches:
      - main

env:
  DEFAULT_ACCOUNT_ID: ${{ secrets.HUBSPOT_ACCOUNT_ID }}
  DEFAULT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install HubSpot CLI
        run: npm install -g @hubspot/cli

      - name: Link project to HubSpot (generate metadata)
        run: |
          hs project link \
            --account ${{ secrets.HUBSPOT_ACCOUNT_ID }} \
            --personalAccessKey ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }} \
            --projectDir cards/01.simple_version/RentalCars

      - name: HubSpot Project Action
        uses: HubSpot/hubspot-project-actions@v1.1.0
        with:
          project_dir: cards/01.simple_version/RentalCars
